name: consumer-contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - run: npm ci --prefix ts --no-audit --no-fund
      - run: npm test --prefix ts
      - run: node verification/check-crlf-docs.cjs
      - run: node --test verification/consumer-contract.test.cjs
      - run: node examples/offline-rates.cjs
